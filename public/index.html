<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Event System</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/x-icon" href="fav.png">
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>Sports Event System</h1>
                <p class="subtitle">Browse upcoming tournaments and secure your spot.</p>
            </div>
            <div class="nav-actions">
                <a href="add-event.html" class="btn-primary">+ Add Event</a>
                <a href="admin.html" class="btn-secondary">View Registrations</a>
            </div>
        </header>

        <main>
            <div id="events-container" class="events-grid">
                <div class="loading">Loading available sports events...</div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('events-container');

            try {
                const response = await fetch('/api/events');
                const events = await response.json();

                if (events.length === 0) {
                    container.innerHTML = `<div class="loading">No sports events available right now. Click "+ Add Event" to create one!</div>`;
                    return;
                }

                container.innerHTML = '';
                events.forEach(ev => {
                    const card = document.createElement('div');
                    card.className = 'event-card';
                    card.innerHTML = `
                        <div>
                            <div class="event-card-header">
                                <h3>${ev.title}</h3>
                                <button onclick="deleteEvent('${ev._id}')" class="delete-link-btn">Delete</button>
                            </div>
                            <div class="event-details">
                                <p><strong>Sport:</strong> ${ev.sport}</p>
                                <p><strong>Date:</strong> ${ev.date}</p>
                                <p><strong>Location:</strong> ${ev.location}</p>
                                <p><strong>Slots:</strong> ${ev.maxParticipants}</p>
                            </div>
                        </div>
                        <div>
                            <a href="register.html?eventId=${ev._id}&eventTitle=${encodeURIComponent(ev.title)}" class="register-btn">Register Now</a>
                        </div>
                    `;
                    container.appendChild(card);
                });

            } catch (err) {
                console.error('Error fetching events:', err);
                container.innerHTML = `<div class="error">Failed to load events. Is the server running?</div>`;
            }
        });

        // Global delete function
        async function deleteEvent(eventId) {
            if (!confirm('Are you sure you want to delete this event? All registered students for this event will also be removed.')) {
                return;
            }

            try {
                const response = await fetch(`/api/events/${eventId}`, {
                    method: 'DELETE'
                });

                const result = await response.json();

                if (response.ok) {
                    alert('Event deleted successfully!');
                    location.reload();
                } else {
                    alert(result.error || 'Failed to delete event.');
                }
            } catch (err) {
                console.error('Error deleting event:', err);
                alert('Network error while deleting event.');
            }
        }
    </script>
</body>
</html>
