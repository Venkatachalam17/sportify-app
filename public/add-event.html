<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Event</title>
    <link rel="stylesheet" href="css/style.css">
     <link rel="icon" type="image/x-icon" href="fav.png">
</head>
<body>
    <div class="container">
        <div class="form-container">
            <a href="index.html" class="back-link">← Back to Events</a>
            <h2 style="color: var(--text-main); margin-bottom: 0.5rem; font-size: 1.5rem; font-weight: 700;">Add New Event</h2>
            <p class="subtitle" style="margin-bottom: 1.5rem;">Create a tournament for students to join.</p>

            <div id="success-banner">Event Created Successfully! Redirecting...</div>

            <form id="add-event-form">
                <div class="form-group">
                    <label for="title">Event Title</label>
                    <input type="text" id="title" placeholder="e.g., Inter-College Basketball Championship" required>
                </div>

                <div class="form-group">
                    <label for="sport">Sport Name</label>
                    <input type="text" id="sport" placeholder="e.g., Basketball" required>
                </div>

                <div class="form-group">
                    <label for="date">Event Date</label>
                    <input type="date" id="date" required>
                </div>

                <div class="form-group">
                    <label for="location">Location</label>
                    <input type="text" id="location" placeholder="e.g., Indoor Stadium" required>
                </div>

                <div class="form-group">
                    <label for="maxParticipants">Max Participants / Slots</label>
                    <input type="number" id="maxParticipants" placeholder="e.g., 30" required>
                </div>

                <button type="submit" class="submit-btn">Publish Event</button>
            </form>
        </div>
    </div>

    <script>
        const form = document.getElementById('add-event-form');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const title = document.getElementById('title').value.trim();
            const sport = document.getElementById('sport').value.trim();
            const date = document.getElementById('date').value;
            const location = document.getElementById('location').value.trim();
            const maxParticipants = document.getElementById('maxParticipants').value;

            try {
                const response = await fetch('/api/events', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, sport, date, location, maxParticipants })
                });

                const result = await response.json();

                if (response.ok) {
                    document.getElementById('success-banner').style.display = 'block';
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);
                } else {
                    alert(result.error || 'Failed to create event.');
                }
            } catch (err) {
                console.error('Error creating event:', err);
                alert('Network error.');
            }
        });
    </script>
</body>
</html>
